<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>加速車線調査 | 候補抽出</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="area-picker.css">
<script defer src="vendor/leaflet/leaflet.js"></script>
<script defer src="area-picker.js"></script>
</head>
<body>
<header><h1>加速車線の候補抽出</h1><a href="accel-lane-lite/index.html" target="_blank" rel="noopener">測定台帳を開く ↗</a></header>
<main>
<form id="extract-form">
  <label for="dataset">道路データ</label>
  <select id="dataset" required></select>
  <p id="data-hint">取得済みPBFが選択肢に表示されます。</p>
  <fieldset>
    <legend>抽出範囲</legend>
    <label><input type="radio" name="scope" value="all" checked> 選んだ道路データの全域</label>
    <label><input type="radio" name="scope" value="map" id="map-scope" disabled> 地図で指定</label>
  </fieldset>
  <div id="map-controls">
    <button type="button" id="corners" disabled>四角形を選び直す</button>
    <button type="button" id="viewport" disabled>地図の表示範囲を使う</button>
  </div>
  <p id="map-help" role="status">地図を読み込んでいます。</p>
  <button type="submit" id="submit" disabled>候補JSONを作成</button>
  <p id="result" role="status"></p>
</form>
<div id="map" aria-label="候補範囲を選ぶ地図"></div>
</main>
</body>
</html>
